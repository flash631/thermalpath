[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thermalpath"
version = "0.0.1"
description = "Verified thermal resistance calculations for electronics cooling"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "ThermalPath contributors"}]
dependencies = ["numpy>=2.0", "scipy>=1.14", "matplotlib>=3.9"]

[project.scripts]
thermalpath = "thermalpath.cli:main"

[project.optional-dependencies]
app = ["streamlit>=1.40"]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.9", "build>=1.2"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["thermalpath", "thermalpath.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["thermalpath"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
